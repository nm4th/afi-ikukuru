name: "アフィリエイトPR（バチェラーデート、火 21:00 JST）"

# BACHELOR_DATE_URL secret が未設定の場合は何もせず exit 0 で終了する設計。
# 設定後は Settings → Secrets で BACHELOR_DATE_URL を追加すれば cron で動き出す。

on:
  schedule:
    # 火曜 21:00 JST = 12:00 UTC
    - cron: '0 12 * * 2'
  workflow_dispatch:
    inputs:
      format:
        description: '形式'
        required: false
        default: 'thread'
        type: choice
        options:
          - thread
          - single
      dry_run:
        description: 'dry-run（投稿しない）'
        required: false
        default: 'false'
        type: choice
        options:
          - 'false'
          - 'true'

permissions:
  contents: write

jobs:
  pr:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r generator/requirements.txt

      - name: Run PR post
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          X_API_KEY: ${{ secrets.X_API_KEY }}
          X_API_SECRET: ${{ secrets.X_API_SECRET }}
          X_ACCESS_TOKEN: ${{ secrets.X_ACCESS_TOKEN }}
          X_ACCESS_TOKEN_SECRET: ${{ secrets.X_ACCESS_TOKEN_SECRET }}
          BACHELOR_DATE_URL: ${{ secrets.BACHELOR_DATE_URL }}
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            FMT="${{ github.event.inputs.format || 'thread' }}"
            ARGS="--format $FMT"
            if [ "${{ github.event.inputs.dry_run }}" = "true" ]; then
              ARGS="$ARGS --dry-run"
            fi
          else
            ARGS="--format thread"
          fi
          echo "Running: python generator/pr_post.py $ARGS"
          python generator/pr_post.py $ARGS

      - name: Commit history
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          if [ -f history/pr_posts.jsonl ] && [ -n "$(git status history/pr_posts.jsonl --porcelain 2>/dev/null)" ]; then
            git add history/pr_posts.jsonl
            git commit -m "update PR history $(TZ=Asia/Tokyo date '+%Y-%m-%d')"
            for i in 1 2 3 4 5; do
              if git push; then
                exit 0
              fi
              echo "push rejected (attempt $i/5). rebasing..."
              sleep $((i * 2))
              git pull --rebase origin main
            done
            exit 1
          fi
